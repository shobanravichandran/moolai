services:
  falkordb:
    image: ${FALKORDB_IMAGE:-falkordb/falkordb:v4.22.1}
    ports:
      # Host ports differ from the FalkorDB defaults so Moolai runs next to other projects on 6379/3000.
      - "${FALKORDB_PORT:-6380}:6379"          # FalkorDB (Redis protocol)
      - "${FALKORDB_BROWSER_PORT:-3001}:3000"  # FalkorDB Browser
    environment:
      # Image default is TIMEOUT 1000 (ms) and RESULTSET_SIZE 10000: too tight for backtests and graph exports.
      FALKORDB_ARGS: "MAX_QUEUED_QUERIES 25 TIMEOUT 10000 RESULTSET_SIZE 100000"
    volumes:
      - falkordb-data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Full stack: `docker compose --profile app up -d --build`
  api:
    profiles: ["app"]
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
    ports:
      - "${MOOLAI_API_PORT:-8020}:8000"
    depends_on:
      falkordb:
        condition: service_healthy

volumes:
  falkordb-data:
